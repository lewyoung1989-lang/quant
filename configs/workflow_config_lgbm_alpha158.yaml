# Qlib 标准量化实验配置: CSI300 + Alpha158 + LightGBM + Top30
qlib_init:
  provider_uri: "./data/cn_data"
  region: "cn"

market: &market "csi300"
benchmark: &benchmark "SH000300"

data_handler_config: &data_handler_config
  start_time: "2017-01-01"
  end_time: "2020-12-31"
  fit_start_time: "2017-01-01"
  fit_end_time: "2019-12-31"
  instruments: *market

port_analysis_config: &port_analysis_config
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy"
    kwargs:
      signal: "<PRED>"
      topk: 30
      n_drop: 5
      only_tradable: true
  backtest:
    start_time: "2020-07-01"
    end_time: "2020-12-31"
    account: 1000000
    benchmark: *benchmark
    exchange_kwargs:
      freq: "day"
      limit_threshold: 0.095
      deal_price: "close"
      open_cost: 0.00025
      close_cost: 0.00075
      min_cost: 5

task:
  model:
    class: "LGBModel"
    module_path: "qlib.contrib.model.gbdt"
    kwargs:
      loss: "mse"
      colsample_bytree: 0.8879
      learning_rate: 0.0421
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 2
      early_stopping_rounds: 50
      num_boost_round: 300

  dataset:
    class: "DatasetH"
    module_path: "qlib.data.dataset"
    kwargs:
      handler:
        class: "Alpha158"
        module_path: "qlib.contrib.data.handler"
        kwargs: *data_handler_config
      segments:
        train: ["2017-01-01", "2019-12-31"]
        valid: ["2020-01-01", "2020-06-30"]
        test: ["2020-07-01", "2020-12-31"]

  record:
    - class: "SignalRecord"
      module_path: "qlib.workflow.record_temp"
      kwargs:
        model: "<MODEL>"
        dataset: "<DATASET>"
    - class: "PortAnaRecord"
      module_path: "qlib.workflow.record_temp"
      kwargs:
        config: *port_analysis_config
        freq: "day"
