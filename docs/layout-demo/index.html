lor:#795620}.execution p{font-size:11px;color:#795620;margin-top:3px}.quotes{padding:0 20px}.quote{padding:18px 0;border-bottom:1px solid var(--line)}.quote:last-child{border:0}.quote-title,.quote-data{display:flex;align-items:center;justify-content:space-between;gap:12px}.quote-title span{font-size:12px}.quote-title small{font-size:10px}.quote-data{margin-top:10px}.quote-data strong{font-size:22px;font-weight:550;font-variant-numeric:tabular-nums}.quote-data span{font-size:12px}.quote-data small{color:inherit}.quote-foot{padding:10px 20px;background:#fafbfc;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}.details{margin-top:26px;border-top:1px solid var(--line)}.details>summary{padding:17px 0;font-weight:550;font-size:13px}.detail-body{display:grid;grid-template-columns:1fr 1fr;gap:30px;background:white;padding:20px;border:1px solid var(--line);border-radius:8px}.detail-body p{font-size:12px;margin:10px 0;color:var(--muted)}.footer{display:flex;gap:20px;justify-content:space-between;margin-top:26px;font-size:11px;color:var(--muted)}.empty{padding:52px 28px;text-align:center}.empty svg{width:34px;height:34px;color:#7b8798;margin-bottom:12px}.empty h2{margin-bottom:8px}.empty p{color:var(--muted);font-size:13px;max-width:55ch;margin:0 auto 20px}.research-note{display:flex;gap:28px;margin:0 0 24px;color:var(--muted);font-size:12px}.research-note b{color:var(--ink);font-weight:500}.research-result{padding:24px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-bottom:24px}.result-grid p{color:var(--muted);font-size:12px}.result-grid strong{display:block;font-size:24px;margin-top:5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#202735;color:white;border-radius:8px;padding:12px 20px;box-shadow:0 8px 24px #20273522;z-index:10;max-width:calc(100% - 32px);font-size:13px}.toast[hidden]{display:none}a{color:var(--accent);text-underline-offset:3px}.check{display:flex;align-items:center;gap:8px; @media(min-width:1550px){.content{padding-top:40px}.decision{padding:30px}.account-strip{padding:28px 0}.split{gap:28px}}

<body>
<div class="shell">
<aside class="sidebar">
<div class="brand"><span class="mark"><svg class="icon" viewBox="0 0 24 24"><path d="M4 18V5M4 18h16M7 14l4-5 4 3 5-7"/></svg></span><div>A股量化<small>Qlib 投研工作台</small></div></div>
<nav class="nav" aria-label="工作模式"><div class="nav-label" style="grid-column:1/-1">工作模式</div>
<button data-mode="daily" class="active" aria-current="page"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16m-11 5 2 2 4-4"/></svg>今日调仓</button>
<button data-mode="rotation"><svg class="icon" viewBox="0 0 24 24"><path d="M5 8h14l-4-4M19 16H5l4 4M19 8v4M5 16v-4"/></svg>攻守轮动</button>
<button data-mode="factor"><svg class="icon" viewBox="0 0 24 24"><path d="M9 3h6M10 3v7L5 18a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-8V3M8 15h8"/></svg>因子实验室</button>
<button data-mode="ai"><svg class="icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M10 10h4v4h-4zM9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"/></svg>AI 多因子</button>
</nav>
<section id="settings" class="settings" aria-label="当前模式参数"></section>
<div class="source"><b>数据来源</b>Qlib 历史数据 · 新浪行情<br>布局演示，未连接行情或交易服务</div>
</aside>
<div class="workspace"><header class="topbar"><span><strong id="crumb">模拟交易</strong> / <span id="crumb-sub">今日调仓</span></span><span class="badge">DEMO · 演示数据</span></header><main id="main" class="content"></main></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s);
let mode='daily',result=false,timer;
const refreshIcon='<svg class="icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg>';
const field=(label,control)=>`<div class="field"><label>${label}${control}</label></div>`;
const select=options=>`<select>${options.map(x=>`<option>${x}</option>`).join('')}</select>`;
const input=(v,type='text')=>`<input type="${type}" value="${v}">`;
const period=()=>`<div class="field"><label><span class="range-head"><span>动量周期</span><b id="period-value">20 日</b></span><input id="period" aria-label="动量周期" type="range" min="5" max="60" step="5" value="20"></label></div>`;
const fees=()=>`<details><summary>更多设置 · 费率与基准</summary>${field('基准标的',input('SH000300'))}${field('买入佣金（万分之）',input('1','number'))}${field('卖出费率（万分之）',input('1','number'))}<p class="hint">参数仅用于布局演示。</p></details>`;
function settings(){let common=`${field('进攻标的',select(['创业板ETF · 159915','双创50ETF · 588380']))}${field('防守标的',select(['红利低波ETF · 512890','国债ETF · 511010']))}${period()}`;
let html='';
if(mode==='daily')html=`<h3>调仓设置</h3><div class="settings-grid">${field('模拟账户',select(['模拟实盘 1 号','模拟实盘 2 号']))}${common}</div><details><summary>账户与自动调仓</summary><label class="check"><input type="checkbox" checked>尾盘自动模拟调仓</label><p class="hint">仅在 14:45–14:55 时间窗执行。</p>${field('新账户名称','<input id="new-account" placeholder="输入模拟账户名称">')}<button id="create-account" class="btn full">新建模拟账户</button></details>${fees()}`;
if(mode==='rotation')html=`<h3>回测设置</h3><div class="settings-grid">${common}${field('开始日期',input('2019-01-18','date'))}${field('结束日期',input('2026-10-09','date'))}</div>${fees()}`;
if(mode==='factor')html=`<h3>选股规则</h3><div class="settings-grid">${field('标的池',select(['指数 ETF 核心轮动池','沪深300股票池','中证500股票池']))}${field('因子预设',select(['20日动量','自定义表达式']))}${field('因子表达式','<textarea aria-label="因子表达式">$close / Ref($close, 20) - 1</textarea>')}${field('选股方向',select(['因子值最大优先','因子值最小优先']))}${field('持仓数量 Top-K',input('2','number'))}${field('开始日期',input('2020-01-01','date'))}${field('结束日期',input('2026-10-09','date'))}</div>${fees()}`;
if(mode==='ai')html=`<h3>训练与组合设置</h3><div class="settings-grid">${field('标的池',select(['沪深300股票池','中证500股票池']))}${field('训练开始',input('2008-01-01','date'))}${field('训练结束',input('2014-12-31','date'))}${field('回测开始',input('2015-01-01','date'))}${field('回测结束',input('2021-12-31','date'))}${field('持仓数量 Top-K',input('30','number'))}${field('调仓淘汰数 N-Drop',input('5','number'))}</div>${fees()}`;
$('#settings').innerHTML=html;
$('#period')?.addEventListener('input',e=>$('#period-value').textContent=e.target.value+' 日');
$('#create-account')?.addEventListener('click',()=>{const name=$('#new-account').value.trim();if(!name){$('#new-account').focus();toast('请先输入账户名称');return}const account=$('#settings select');account.add(new Option(name,name));account.value=name;toast('演示账户已创建，刷新后恢复初始状态')});
}
function daily(){return `<div class="page-head"><div><h1>今日调仓</h1><p>先看今日决策，再核对模拟执行清单。</p></div><button class="btn" id="refresh">${refreshIcon}刷新行情</button></div>
<section class="decision" aria-label="今日决策"><div><span class="badge">盘中预览 · 尚未到执行时间</span><h2>全仓建仓买入 红利低波ETF</h2><p>当前账户为空仓，目标为防守标的。使用可用现金建立模拟持仓。</p></div><div class="decision-time"><small>尾盘执行窗口</small><strong>14:45–14:55</strong><p>行情快照 2026-10-12 13:48:51</p></div></section>
<section class="account-strip" aria-label="账户概况"><div><label>账户总资产</label><div class="value">¥100,000.00</div><small>累计模拟收益 <b>0.00%</b></small></div><div><label>当前持仓</label><div class="value">空仓</div><small>持仓市值 ¥0.00</small></div><div><label>可用现金</label><div class="value">¥100,000.00</div><small>模拟实盘 1 号</small></div></section>
<div class="split"><section><div class="panel"><div class="panel-header"><h2>调仓执行清单</h2><span class="badge">1 笔待执行</span></div><div class="table-wrap"><table><thead><tr><th>操作 / 标的</th><th class="n">数量（股）</th><th class="n">参考价</th><th>状态</th></tr></thead><tbody><tr><td><b class="pos">买入</b> 红利低波ETF<small>SH512890</small></td><td class="n">81,500</td><td class="n">¥1.226</td><td><span class="badge">待尾盘执行</span></td></tr></tbody></table></div><div class="order-summary"><span>预计成交金额 · 未含费用</span><b>¥99,919.00</b></div></div><div class="execution"><div><strong>等待尾盘决策窗口</strong><p>盘中信号供观察，14:45–14:55 可执行模拟调仓。</p></div><button class="btn" disabled aria-describedby="execution-note">执行模拟调仓</button></div><p id="execution-note" class="muted" style="font-size:11px;margin-top:8px">此 demo 固定为盘中状态，执行按钮不可用。</p></section>
<section class="panel"><div class="panel-header"><h2>攻守标的行情</h2><small>20 日动量</small></div><div class="quotes"><div class="quote"><div class="quote-title"><span>创业板ETF</span><small>进攻 · SZ159915</small></div><div class="quote-data"><strong>¥3.008</strong><span class="neg"><small>动量</small> −8.99%</span></div></div><div class="quote"><div class="quote-title"><span>红利低波ETF</span><small>防守 · SH512890</small></div><div class="quote-data"><strong>¥1.226</strong><span class="pos"><small>动量</small> +1.57%</span></div></div></div><div class="quote-foot">涨幅为红色，跌幅为绿色；同时显示正负号。</div></section></div>
<details class="details"><summary>查看调仓记录与判断依据</summary><div class="detail-body"><section><h3>历史调仓记录</h3><p>账户暂无调仓记录。</p><p>执行模拟调仓后，在这里查看时间、标的与成交金额。</p></section><section><h3>动量规则与行情质量</h3><p>进攻动量为 −8.99%，未满足进攻条件。<br>防守动量为 +1.57%，当前目标为防守标的。</p><p>以上为截图数据的布局展示。实际规则结果与行情时效由后端提供。</p></section></div></details>`}
const meta={rotation:['攻守轮动','选择进攻与防守标的，验证历史轮动表现。','运行轮动回测','双资产轮动回测','先确认左侧标的与日期，再运行回测。结果集中展示收益、风险和交易记录。'],factor:['因子实验室','从经典因子开始，或直接编辑自己的表达式。','运行因子回测','因子选股回测','选择标的池和因子，设置持仓数量后运行。无需切换到其他页面配置。'],ai:['AI 多因子','使用 LightGBM 与 Alpha158，训练模型并回测组合。','训练并回测','模型训练与回测','设置训练区间与回测区间，完成后查看组合表现、预测结果与成交记录。']};
function research(){const [title,sub,action,empty,desc]=meta[mode];return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><button id="run" class="btn primary">${action}</button></div><div class="research-note"><span>引擎 <b>${mode==='ai'?'LightGBM + Alpha158':'Qlib / 策略回测'}</b></span><span>参数 <b>集中在左侧</b></span><span>结果 <b>集中在当前页面</b></span></div><section class="panel">${result?`<div class="panel-header"><h2>回测结果布局</h2><span class="badge">示例占位 · 无实际计算</span></div><div class="research-result"><div class="result-grid"><div><p>累计收益</p><strong>—</strong></div><div><p>最大回撤</p><strong>—</strong></div><div><p>夏普比率</p><strong>—</strong></div></div><div class="info-line">净值与回撤图放置区域 · 接入实际回测报告后展示</div><details class="details"><summary>周期收益、成交与持仓明细</summary><p class="muted">复用当前项目的周期收益、逐笔成交和每日持仓结果。</p></details></div>`:`<div class="empty"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15v-4m5 4V8m5 7V5"/></svg><h2>${empty}</h2><p>${desc}</p><span class="badge">尚未运行</span></div>`}</section><details class="details"><summary>查看策略说明</summary><div class="detail-body"><p>${mode==='ai'?'模型：LightGBM；特征：Alpha158。训练和回测区间分别配置，结果保留现有报告字段。':mode==='factor'?'支持经典因子和自定义表达式，按因子排序选取 Top-K 标的。':'通过动量与趋势条件，在进攻标的和防守标的之间轮动。'}</p><p>此页面仅验证功能分区与操作路径，按钮展示结果区域，不执行计算。</p></div></details>`}
function render(){settings();const name=mode==='daily'?'今日调仓':meta[mode][0];$('#crumb').textContent=mode==='daily'?'模拟交易':'策略研究';$('#crumb-sub').textContent=name;$('#main').innerHTML=(mode==='daily'?daily():research())+`<footer class="footer"><span>布局 Demo · 所有数据为演示，操作不连接实际服务</span><a href="./HANDOFF.md">查看实施说明</a></footer>`;$('#refresh')?.addEventListener('click',()=>{const b=$('#refresh');b.disabled=true;b.textContent='刷新中…';setTimeout(()=>{b.disabled=false;b.innerHTML=refreshIcon+'刷新行情';toast('演示行情已刷新，数据快照保持不变')},650)});$('#run')?.addEventListener('click',()=>{result=true;render();toast('已展示回测结果布局，未执行实际计算')});}
function toast(msg){clearTimeout(timer);$('#toast').textContent=msg;$('#toast').hidden=false;timer=setTimeout(()=>$('#toast').hidden=true,3000)}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;result=false;document.querySelectorAll('[data-mode]').forEach(n=>{n.classList.toggle('active',n===b);if(n===b)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});render()}));render();
</script></body></html>
